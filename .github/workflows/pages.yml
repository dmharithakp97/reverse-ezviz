name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: ["claude/ezviz-android-reverse-eng-t4gl98"]
    paths: ["index.html", "webapp/**", ".github/workflows/pages.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
